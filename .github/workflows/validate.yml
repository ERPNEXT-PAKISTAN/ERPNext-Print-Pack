name: Validate

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: pip install pytest
      - name: Validate repository
        run: python scripts/validate_repository.py
      - name: Check licenses
        run: python scripts/check_licenses.py
      - name: Build catalog
        run: python scripts/build_catalog.py
      - name: Run tests
        run: pytest -q
      - name: Ensure catalog committed
        run: git diff --exit-code FORMAT_CATALOG.md || (echo 'Run scripts/build_catalog.py and commit FORMAT_CATALOG.md' && exit 1)
