{% if doc.items %}<table class="epp-table"><thead><tr><th>Item</th><th>Qty</th><th>Disc%</th><th>Amount</th></tr></thead><tbody>{% for row in doc.items %}<tr><td>{{ row.item_name or row.item_code or "" }}</td><td class="right">{{ row.qty or "" }}</td><td class="right">{{ row.discount_percentage or 0 }}</td><td class="right">{{ row.amount or "" }}</td></tr>{% endfor %}</tbody></table>{% endif %}
