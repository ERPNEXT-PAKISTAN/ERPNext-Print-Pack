{% if doc.items %}<table class="epp-table"><thead><tr><th>Item</th><th>Qty</th><th>UOM</th></tr></thead><tbody>{% for row in doc.items %}<tr><td>{{ row.item_code or row.item_name or "" }}</td><td class="right">{{ row.qty or row.required_qty or "" }}</td><td>{{ row.uom or row.stock_uom or "" }}</td></tr>{% endfor %}</tbody></table>{% endif %}
