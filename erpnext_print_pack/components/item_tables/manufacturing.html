{% if doc.items %}<table class="epp-table"><thead><tr><th style="width:5%">#</th><th style="width:45%">Item</th><th style="width:20%" class="right">Qty</th><th style="width:30%">UOM</th></tr></thead><tbody>{% for row in doc.items %}<tr><td>{{ loop.index }}</td><td>{{ row.item_code or row.item_name or "" }}</td><td class="right">{{ row.qty or row.required_qty or "" }}</td><td>{{ row.uom or row.stock_uom or "" }}</td></tr>{% endfor %}</tbody></table>{% endif %}
