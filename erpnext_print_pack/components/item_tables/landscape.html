{% if doc.items %}<table class="epp-table"><thead><tr><th>#</th><th>Code</th><th>Description</th><th>Qty</th><th>UOM</th><th>Rate</th><th>Amount</th></tr></thead><tbody>{% for row in doc.items %}<tr><td>{{ loop.index }}</td><td>{{ row.item_code or "" }}</td><td>{{ row.description or row.item_name or "" }}</td><td class="right">{{ row.qty or "" }}</td><td>{{ row.uom or "" }}</td><td class="right">{{ row.rate or "" }}</td><td class="right">{{ row.amount or "" }}</td></tr>{% endfor %}</tbody></table>{% endif %}
