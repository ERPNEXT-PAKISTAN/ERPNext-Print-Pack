{% if doc.items %}<table class="epp-table"><thead><tr><th>Item</th><th>Batch</th><th>Serial</th><th>Qty</th></tr></thead><tbody>{% for row in doc.items %}<tr><td>{{ row.item_code or "" }}</td><td>{{ row.batch_no or "" }}</td><td>{{ row.serial_no or "" }}</td><td class="right">{{ row.qty or "" }}</td></tr>{% endfor %}</tbody></table>{% endif %}
