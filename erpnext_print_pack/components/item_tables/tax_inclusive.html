{% if doc.items %}<table class="epp-table"><thead><tr><th>#</th><th>Item</th><th>Qty</th><th>Rate</th><th>Tax</th><th>Amount</th></tr></thead><tbody>{% for row in doc.items %}<tr><td>{{ loop.index }}</td><td>{{ row.item_name or row.item_code or "" }}</td><td class="right">{{ row.qty or "" }}</td><td class="right">{{ row.rate or "" }}</td><td class="right">{{ row.item_tax_rate or "" }}</td><td class="right">{{ row.amount or "" }}</td></tr>{% endfor %}</tbody></table>{% endif %}
