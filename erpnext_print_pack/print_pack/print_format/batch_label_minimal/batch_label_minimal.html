{# Generated by erpnext_print_pack · Batch · minimal · original #}
{% set title = "Batch Label" %}
{% set date_field = "creation" %}
<style>

@page {
	size: A4 portrait;
	margin: 8mm;
}
.epp-root {
	font-family: Arial, Helvetica, sans-serif;
	font-size: 9px;
	color: #111;
	line-height: 1.25;
}
.epp-primary { color: #333333; }
.epp-accent { color: #666666; }
.epp-header {
	background: #ffffff;
	border-bottom: 2px solid #333333;
	padding: 8px 10px;
	margin-bottom: 8px;
}
.epp-box {
	border: 1px solid #333333;
	border-radius: 3px;
	padding: 6px 8px;
	margin-bottom: 4px;
}
.epp-table {
	width: 100%;
	border-collapse: collapse;
}
.epp-table th {
	background: #ffffff;
	color: #333333;
	border: 1px solid #333333;
	padding: 4px;
	font-size: 8px;
	text-align: center;
}
.epp-table td {
	border: 1px solid #333333;
	padding: 4px;
	vertical-align: top;
}
.epp-totals td {
	border: 1px solid #333333;
	padding: 4px 6px;
}
.epp-footer {
	margin-top: 10px;
	font-size: 8px;
	color: #666666;
}

.print-format .epp-table > tbody > tr > td { padding: 0 !important; }
</style>
<div class="epp-root print-format">
<div class="epp-box" style="padding:3px 5px;font-size:8px"><span class="bold">{{ title }}</span> · {{ doc.name or "" }}</div>

<div class="epp-box center">{% if doc.name %}<div style="font-family:monospace;letter-spacing:2px">{{ doc.name }}</div>{% endif %}</div>

{% if doc.remarks or doc.notes %}<div class="epp-box">{{ doc.remarks or doc.notes }}</div>{% endif %}

</div>
